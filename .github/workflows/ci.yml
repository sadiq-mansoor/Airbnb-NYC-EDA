name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data-integrity:
    name: Dataset integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pytest

      - name: Run data-integrity tests
        run: pytest tests/ -v
